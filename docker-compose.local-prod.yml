services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: onepiecetcg
      POSTGRES_USER: onepiecetcg
      POSTGRES_PASSWORD: onepiecetcg
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onepiecetcg -d onepiecetcg']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - packages/api/.env.production.local
    ports:
      - '3000:3000'
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      api:
        condition: service_started
    env_file:
      - packages/web/.env.production.local
    ports:
      - '3001:3001'
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    depends_on:
      web:
        condition: service_started
    command: tunnel --url http://web:3001
    restart: unless-stopped

volumes:
  db-data:
